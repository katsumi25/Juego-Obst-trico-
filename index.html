{n:'Control prenatal',e:'G1P0 · 28 sem',h:'Sin antecedentes. Control mensual.',s:'Asintomática. Movimientos fetales presentes.',a:{},c:{s:128,d:84},req:['bp','peso','au','leo','dop','lab','hierro','vac','cons'],r:.5,rm:'c'},

{n:'Amenaza de aborto',e:'G3P1 · 10 sem',h:'Un aborto previo.',s:'Sangrado vaginal leve y cólico bajo.',a:{fc:92},c:{fc:120,s:90,d:55},eco:'Saco intrauterino, embrión con latido +, hematoma subcoriónico',req:['eco','dop','reposo'],r:1,rm:'u'},
{n:'Preeclampsia severa',e:'G1P0 · 35 sem',h:'Madre con hipertensión.',s:'Cefalea intensa, escotomas, edemas, epigastralgia.',a:{s:168,d:108,fc:96},c:{s:205,d:130,sat:93},lab:'Proteínas +++',req:['bp','lab','lbl','mg','sonda','cort'],r:1.1,rm:'u'},
{n:'Trabajo de parto activo',e:'G2P1 · 39 sem',h:'Embarazo normal.',s:'Contracciones c/3 min, rotura de membranas, siente pujo.',a:{fc:94},c:{fcf:90,fc:112},dil:'8 cm, borrado 100%, cefálico +1, líquido claro',req:['tacto','ctg','anest','parto','pinz','alumb'],r:1,rm:'p'},
{n:'Hemorragia posparto (atonía)',e:'G4P3 · puerperio inmediato',h:'Multípara, parto prolongado.',s:'Sangrado profuso, útero blando, mareo, palidez.',a:{fc:118,s:92,d:58,sat:96},c:{fc:150,s:62,d:35,sat:90},req:['bp','iv','masaje','oxi','tranex','sonda'],r:1.4,rm:'p'},
{n:'Eclampsia',e:'G1P0 · 37 sem',h:'Preeclampsia sin control.',s:'Convulsión tónico-clónica, pérdida de conciencia.',a:{s:185,d:120,fc:110,sat:92},c:{s:215,d:135,sat:84,fcf:100},req:['o2','mg','bp','lbl','cesarea'],r:1.4,rm:'u'},
{n:'Desprendimiento de placenta',e:'G3P2 · 34 sem',h:'Hipertensa crónica, fumadora.',s:'Dolor brusco, útero leñoso, sangrado oscuro.',a:{fc:112,s:100,d:60,fcf:105},c:{fc:140,s:75,d:40,fcf:60},req:['bp','dop','iv','cort','cesarea'],r:1.4,rm:'u'},
{n:'Placenta previa sangrante',e:'G2P1 · 33 sem',h:'Cesárea previa.',s:'Sangrado rojo vivo, indoloro. ¡Prohibido el tacto vaginal!',a:{fc:106,s:98,d:60},c:{fc:140,s:70,d:40,fcf:90},eco:'Placenta previa total cubriendo el OCI',no:['tacto'],req:['eco','iv','dop','cort','cesarea'],r:1.3,rm:'u'},
{n:'Distocia de hombros',e:'G2P1 · 40 sem, macrosomía',h:'Diabetes gestacional.',s:'Cabeza fuera, "signo de la tortuga", hombros atascados.',a:{fc:110,fcf:100},c:{fcf:60,fc:130},dil:'Dilatación completa, hombro anterior impactado',req:['mcr','epi','parto'],r:1.8,rm:'p'},
{n:'Sepsis puerperal',e:'P2 · puerperio día 5',h:'Parto con retención de restos.',s:'Fiebre alta, loquios fétidos, taquicardia, confusión.',a:{t:39.4,fc:122,s:90,d:55,sat:94},c:{t:41,fc:150,s:68,d:38,sat:87},req:['temp','bp','antib','iv','o2'],r:1.5,rm:'h'}];
const NMS=['María Condori','Lucía Ramos','Carmen Flores','Rosa Huamán','Ana Torres','Julia Mamani','Elena Quispe','Sofía Vargas'];
const NP=[{n:'Enf. Rosa Quispe',y:14,h:'320 partos, 28 hemorragias posparto, 6 eclampsias'},{n:'Téc. Luis Paredes',y:6,h:'140 vías difíciles, 40 traslados a quirófano'},{n:'Enf. Carla Mendoza',y:9,h:'210 partos, 3 distocias de hombros, 12 desprendimientos'},{n:'Obst. Marta Salas',y:20,h:'600 partos, 35 cesáreas urgentes, 15 sepsis puerperales'}];

// ---------- 3D ----------
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true}),S=new THREE.Scene();S.background=new THREE.Color(0x1c2b35);S.fog=new THREE.Fog(0x1c2b35,40,90);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;R.outputEncoding=THREE.sRGBEncoding;R.setPixelRatio(Math.min(2,devicePixelRatio));
const cam=new THREE.PerspectiveCamera(55,1,.1,200);
S.add(new THREE.HemisphereLight(0xffffff,0x778899,.9));const dl=new THREE.DirectionalLight(0xfff1dd,.9);dl.position.set(12,30,14);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);Object.assign(dl.shadow.camera,{left:-38,right:38,top:28,bottom:-28,near:1,far:80});S.add(dl);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7,metalness:.05});
function box(w,h,d,x,y,z,c,g=S){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);g.add(m);return m}
const col=[];
function wall(x1,z1,x2,z2){const t=.3;box(Math.abs(x2-x1)+t,3.2,Math.abs(z2-z1)+t,(x1+x2)/2,1.6,(z1+z2)/2,0xeef3f6);col.push([Math.min(x1,x2)-t/2,Math.min(z1,z2)-t/2,Math.max(x1,x2)+t/2,Math.max(z1,z2)+t/2])}
box(60,.2,40,0,-.1,0,0xb8c2c8);
function label(t,x,z){const k=document.createElement('canvas');k.width=512;k.height=64;const g=k.getContext('2d');g.fillStyle='#000a';g.fillRect(0,0,512,64);g.fillStyle='#fff';g.font='bold 30px sans-serif';g.textAlign='center';g.fillText(t,256,44);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k)}));s.scale.set(6,.75,1);s.position.set(x,2.9,z);S.add(s)}
const TILE=(()=>{const k=document.createElement('canvas');k.width=k.height=128;const g=k.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,128,128);g.strokeStyle='#0003';g.lineWidth=3;g.strokeRect(0,0,128,128);const t=new THREE.CanvasTexture(k);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(10,8.5);return t})();for(const k in RM){const r=RM[k];box(20,.22,17,r.x,0,r.z,r.c).material.map=TILE;label(r.n,r.x,r.z<0?-4.5:4.5);}
wall(-30,-20,30,-20);wall(-30,20,30,20);wall(-30,-20,-30,20);wall(30,-20,30,20);
[-10,10].forEach(x=>{wall(x,-20,x,-3);wall(x,3,x,20)});
[-20,0,20].forEach(cx=>{[-3,3].forEach(z=>{wall(cx-10,z,cx-2.2,z);wall(cx+2.2,z,cx+10,z)})});
box(3,.9,6,20,.5,-14,0xdddddd);box(1.5,.2,1.5,20,3,-14,0xffffcc);box(3,1,1,0,.5,8,0x8b6b4a);box(3,1,1,-20,.5,8,0x8b6b4a);box(8,.1,1,0,.1,0,0x6aa7ee);
function person(col,o={}){const g=new THREE.Group();
const a=(geo,c,x,y,z)=>{const m=new THREE.Mesh(geo,M(c));m.position.set(x,y,z);g.add(m);return m};
a(new THREE.CylinderGeometry(.13,.12,.85,8),o.pants||0x335,-.15,.43,0);a(new THREE.CylinderGeometry(.13,.12,.85,8),o.pants||0x335,.15,.43,0);
a(new THREE.CylinderGeometry(.3,.26,.75,10),col,0,1.2,0);a(new THREE.CylinderGeometry(.08,.08,.7,6),col,-.4,1.2,0);a(new THREE.CylinderGeometry(.08,.08,.7,6),col,.4,1.2,0);
a(new THREE.SphereGeometry(.2,12,10),0xe0b090,0,1.78,0);
if(o.cap)a(new THREE.SphereGeometry(.22,12,6,0,6.3,0,1.57),o.cap,0,1.82,0);
if(o.hair)a(new THREE.SphereGeometry(.22,12,6,0,6.3,0,1.9),o.hair,0,1.82,-.02);
if(o.belly)a(new THREE.SphereGeometry(.3,10,8),col,0,1.1,.22);return g}
const player=person(0x2ec4a6,{pants:0x1f9d85,coat:1,sleeve:0xffffff,cap:0x1f9d85});S.add(player);player.position.set(0,0,0);
const arrow=new THREE.Mesh(new THREE.ConeGeometry(.2,.4,8),M(0xf2c14e));arrow.rotation.x=Math.PI;player.add(arrow);
let dyn=new THREE.Group();S.add(dyn);

// ---------- Estado ----------
let L=1,score=0,state='menu',tleft=0,T=0,P=[],N=[],open=null;
try{L=Math.min(12,+localStorage.getItem('og_lv')||1)}catch(e){}
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()=='e')interact();if(e.key=='Escape')closeP()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function log(t,c){const l=$('log'),p=document.createElement('p');p.innerHTML=t;if(c)p.style.color=c;l.appendChild(p);l.scrollTop=1e5}
function ov(h){$('ov').hidden=false;$('ovc').innerHTML=h}
function menu(){state='menu';ov(`<h2>🩺 Obstetra de Guardia</h2><p><b>${RANKS[L-1]}</b> — Nivel ${L} de 12</p>
<p><b>Cómo jugar:</b> mueve a la obstetra con <b>WASD / flechas</b> (o el joystick) y arrastra con el mouse o el dedo para girar la cámara como en un juego de disparos (tipo Free Fire; rueda = zoom, V = vista cercana). Acércate a una paciente y pulsa <b>E</b> para atenderla; también puedes pulsar E junto a una enfermera para escuchar su reporte y consejo.</p>
<p>Los signos vitales <b>no se ven hasta que usas el equipo</b> (tensiómetro, oxímetro, Doppler, termómetro, CTG, ecógrafo...). Interpreta síntomas y signos, aplica los tratamientos correctos antes de que la paciente se deteriore y luego dala de alta. Los tratamientos erróneos empeoran el cuadro. Tienes tiempo limitado. Cada nivel superado te asciende en el centro de salud.</p>
<button class="go" onclick="start()">Comenzar nivel ${L}</button>`)}
function start(){$('ov').hidden=true;S.remove(dyn);dyn=new THREE.Group();S.add(dyn);P=[];N=[];closeP();$('log').innerHTML='';
const n=1+Math.floor((L-1)/3),ids=[L-1];while(ids.length<n)ids.push(Math.floor(Math.random()*L));const used={};
ids.forEach((id,i)=>{const c=C[id],r=RM[c.rm],k=(used[c.rm]=(used[c.rm]||0)+1)-1,bx=r.x-6+6*(k%3),bz=r.z+(r.z<0?-3.5:3.5);
box(1.3,.5,2.6,bx,.4,bz+.1,0xffffff,dyn);box(.8,.2,.5,bx,.75,bz-1,0xdde,dyn);box(.5,1.2,.4,bx+1.4,.6,bz-.8,0x445,dyn);box(.5,.4,.1,bx+1.4,1.4,bz-.6,0x1cff9a,dyn);
const m=person(0xf3a6c0,{belly:1,hair:0x4a2c1a});m.rotation.x=-Math.PI/2;m.position.set(bx,1,bz+.9);dyn.add(m);box(1,.14,.95,bx,1.2,bz+.5,0x7fc8b8,dyn);
const nm=person(0x4a90d9,{cap:0xffffff,pants:0xffffff});nm.position.set(bx+2,0,bz+.3);dyn.add(nm);
P.push({c,name:NMS[(i*3+L)%8],age:18+Math.floor(Math.random()*20),risk:.2+.02*L+Math.random()*.05,tf:0,done:new Set(),meas:{},room:c.rm,x:bx,z:bz,st:'act',m,A:{...VN,...c.a},sayT:2+i*5,fl:0,dx:0,opts:opts(c),vf:{},prof:NP[i%4]});
N.push({m:nm,x:bx+2,z:bz+.3,p:P[i],pf:NP[i%4],t:Math.random()*6})});
const cs=person(0x4a90d9,{cap:0xffffff,pants:0xffffff});cs.position.set(-6,0,0);dyn.add(cs);N.push({m:cs,x:-6,z:0,pf:NP[3],t:0,co:1});
player.position.set(0,0,0);T=0;tleft=90+90*n;state='play';
log(`<b>Nivel ${L}: ${n} paciente(s).</b> Atiéndelas en el mapa.`,'#2ec4a6')}
const lowM=(a,b,t)=>lerp(a,b,t);
function vit(p){const c=p.c,Cr={...p.A,...c.c},r=Math.min(1),t=Math.min(1,p.risk),o={};for(const k in VN){const b=lowM(p.A[k],VN[k],.9*p.tf);o[k]=lowM(b,Cr[k],t)}return o}
function read(p,id){const v=vit(p),c=p.c,j=x=>Math.round(x+(Math.random()-.5)*2);
return{bp:`PA ${j(v.s)}/${j(v.d)} mmHg`,sat:`SatO₂ ${Math.min(100,j(v.sat))}% · FC ${j(v.fc)} lpm`,dop:`FCF ${j(v.fcf)} lpm`,temp:`${v.t.toFixed(1)} °C`,tacto:c.dil||'Cuello posterior, cerrado, sin sangrado activo',
ctg:`FCF ${j(v.fcf)} lpm · ${c.dil?'contracciones c/2-3 min':'sin contracciones regulares'}`,eco:c.eco||'Feto único vivo, placenta fúndica, líquido normal',lab:c.lab||'Tira reactiva sin hallazgos',peso:'Peso 68 kg · Talla 1.58 m · IMC 27',au:'Altura uterina acorde a la edad gestacional',leo:'Situación longitudinal, cefálico, dorso a la izquierda'}[id]}
function good(p,id){p.done.add(id);p.tf=p.done.size/p.c.req.length;p.risk=Math.max(0,p.risk-.18);score+=40;if(id=='cesarea'||id=='lapa'){p.m.position.set(20,1.25,-13.1);p.room='q';log('Paciente trasladada al quirófano.')}}
function doAct(id){const p=open;if(!p||p.st!='act')return;const req=p.c.req.includes(id);
if(INS[id]){p.meas[id]={v:read(p,id),t:T};if(p.c.no&&p.c.no.includes(id)){p.risk+=.3;score-=100;log('⚠ ¡Contraindicado en este cuadro!','#e5586b')}else if(req&&!p.done.has(id))good(p,id)}
else if(id=='alta'){if(p.done.size<p.c.req.length){log('La paciente aún no está estable para el alta.','#f2c14e');return}
p.st='alta';p.m.visible=false;(occ[p.r0]||[])[p.slot]=0;score+=100+Math.round((1-p.risk)*100);log(`✔ ${p.name} dada de alta / derivada.`,'#2ec4a6');closeP();solved(p)}
else if(!p.dx){log('Primero establece el diagnóstico en el panel.','#f2c14e');return}else if(req){if(!p.done.has(id))good(p,id)}else{p.risk+=.12;score-=50;log(`⚠ ${TX[id]} no está indicado y empeora a ${p.name}.`,'#e5586b')}
vis(p,id);if(open)panel()}
function status(p){return p.risk<.35?['Estable','#2ec4a6']:p.risk<.6?['Vigilar','#f2c14e']:p.risk<.85?['Grave','#f08a3c']:['CRÍTICO','#e5586b']}
function panel(){const p=open,c=p.c,[sl,sc]=status(p),st0=$('pn').scrollTop;$('pn').hidden=false;

function prof(){const was=state=='play';state='menu';ov(`<h2>🩺 Obstetra de Guardia</h2><p>Nombre: <input id='nm' value='${pname}' maxlength='18' style='padding:6px'> Género: <select id='gd' style='padding:6px'><option value='f'>Mujer</option><option value='m'>Hombre</option><option value='x'>Otro / neutro</option></select></p>
<p><b>${title()}</b><br>Nivel ${L} · ${score} puntos · ${resolved} casos resueltos (${resolved%5}/5 para el siguiente nivel)</p>
<p><b>Controles:</b> WASD mover · Shift correr · Espacio saltar · C agacharte · E atender · M mensajes · arrastra para girar la cámara.</p>
<p>Cada <b>5 casos resueltos</b> subes de nivel. Cada paciente que muere te <b>resta 150 puntos</b>, y tus puntos determinan tu puesto (puedes ascender o descender). Con 5 muertes en una guardia termina el turno. Los signos vitales solo se ven al usar el equipo; primero diagnostica y luego trata.</p>
${was?`<button class='go' onclick='resume()'>Continuar</button>`:`<button class='go' onclick='begin()'>Comenzar guardia</button>`}<button onclick='rst()'>↺ Reiniciar progreso</button>`);$('gd').value=gender}
function resume(){apply();$('ov').hidden=true;state='play'}
function begin(){apply();start()}
function rst(){if(!confirm('¿Reiniciar todo el progreso (puntos, nivel y puesto)?'))return;resolved=0;score=0;deaths=0;L=1;lastRank=0;save();state='menu';P.forEach(p=>p.st='alta');prof()}
function solved(p){resolved++;const n=Math.min(12,1+Math.floor(resolved/5));if(n>L){L=n;gap=Math.max(14,58-4*L);log(`⬆ <b>¡Nivel ${L}!</b> Llegan casos más complejos y más rápido.`,'#f2c14e');snd(880,.2);snd(1175,.3)}else log(`Casos resueltos: ${resolved%5}/5 para el siguiente nivel.`,'#2ec4a6');save()}
function die(p){if(p.st!='act')return;p.st='dead';(occ[p.r0]||[])[p.slot]=0;p.m.visible=false;deaths++;score-=150;if(open===p)closeP();log(`<b>✖ ${p.name} falleció</b> (${p.c.n}). −150 puntos. Muertes en la guardia: ${deaths}/5.`,'#e5586b');snd(200,.5,.08,'sawtooth');save();if(deaths>=5){state='menu';closeP();ov(`<h2>🏥 Fin de la guardia</h2><p>Hubo 5 fallecimientos. Puntos: <b>${score}</b> · Puesto: ${title()}</p><button class='go' onclick='begin()'>Nueva guardia</button><button onclick='rst()'>↺ Reiniciar progreso</button>`)}}
setInterval(()=>{if(state!='play')return;const r=rankIdx();if(r>lastRank){log(`🎖 <b>¡Ascenso!</b> Ahora eres ${title()}.`,'#f2c14e');snd(880,.2);snd(1320,.3)}else if(r<lastRank)log(`⬇ Descenso de puesto: ${title()}.`,'#e5586b');lastRank=r},500);
function start(){$('ov').hidden=true;S.remove(dyn);dyn=new THREE.Group();S.add(dyn);P=[];N=[];closeP();$('log').innerHTML='';H.length=0;unread=0;occ={};BD={};NS={};MM={};
TOT=1e9;SP=0;deaths=0;L=Math.min(12,1+Math.floor(resolved/5));gap=Math.max(14,58-4*L);nextT=gap;
const cs=person(0x4a90d9,{cap:0xffffff,pants:0x3a78bf});cs.position.set(-6,0,0);dyn.add(cs);N.push({m:cs,x:-6,z:0,pf:NP[3],t:0,co:1});
player.position.set(0,0,0);T=0;tleft=1e9;state='play';skinP();log(`<b>Guardia iniciada — ${title()}.</b> Los casos llegarán sin parar: prioriza por gravedad.`,'#2ec4a6');spawn();spawn()}
skinP();
addEventListener('resize',rs);rs();menu();requestAnimationFrame(loop);
</script></body></html>
